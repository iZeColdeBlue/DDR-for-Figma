<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { --bg: var(--figma-color-bg, #fff); --fg: var(--figma-color-text, #222); --muted: var(--figma-color-text-secondary, #777);
  --border: var(--figma-color-border, #ddd); --brand: var(--figma-color-bg-brand, #0d99ff); --onbrand: var(--figma-color-text-onbrand, #fff);
  --sub: var(--figma-color-bg-secondary, #f5f5f5); --danger: var(--figma-color-text-danger, #d33); --ok: var(--figma-color-text-success, #1a7f37);
  --warn: var(--figma-color-text-warning, #b26a00); }
* { box-sizing: border-box; }
body { margin: 0; font: 12px/1.45 Inter, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2; }
header button { background: none; border: 0; padding: 6px 10px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; font: inherit; }
header button.on { color: var(--fg); border-bottom-color: var(--brand); font-weight: 600; }
main { padding: 12px; }
button.btn { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
button.btn.primary { background: var(--brand); color: var(--onbrand); border-color: var(--brand); }
button.btn.danger { color: var(--danger); }
button.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.card.sel { border-color: var(--brand); }
.name { font-weight: 600; }
.muted { color: var(--muted); }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); }
.chip.new { color: var(--brand); border-color: var(--brand); }
.chip.changed { color: var(--warn); border-color: var(--warn); }
.chip.up\ to\ date { color: var(--ok); border-color: var(--ok); }
.chip.conflict { color: var(--danger); border-color: var(--danger); }
.grow { flex: 1; min-width: 0; }
label { display: block; margin: 8px 0 2px; font-weight: 600; }
input[type=text], input[type=password] { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
.hint { color: var(--muted); font-size: 11px; margin-top: 2px; }
.banner { padding: 8px 10px; border-radius: 6px; margin: 8px 0; background: var(--sub); }
.banner.err { border: 1px solid var(--danger); color: var(--danger); }
.banner.ok { border: 1px solid var(--ok); }
.banner.warn { border: 1px solid var(--warn); }
.banner a { color: inherit; }
.preview { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
.preview img { max-width: 100%; }
.preview pre { white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, Menlo, monospace; margin: 0; }
.preview code { background: var(--sub); padding: 0 3px; border-radius: 3px; }
.tabs button { margin-right: 4px; }
ul.files { margin: 6px 0; padding-left: 18px; max-height: 160px; overflow: auto; word-break: break-all; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.modal { background: var(--bg); border-radius: 10px; padding: 16px; max-width: 380px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
.modal h3 { margin: 0 0 8px; font-size: 14px; }
.modal .row { justify-content: flex-end; margin-top: 12px; }
.spinner { color: var(--muted); }
</style>
</head>
<body>
<header><button id="tab-docs" class="on">Docs</button><button id="tab-settings">Settings</button></header>
<main id="app"></main>
<script>/*__SCRIPT__*/</script>
</body>
</html>
